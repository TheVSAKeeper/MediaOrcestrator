name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - master

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      should_release: ${{ steps.decide.outputs.should_release }}
      changelog: ${{ steps.changelog.outputs.changelog }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP '(?<=<Version>).*(?=</Version>)' Directory.Build.props)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create tag if needed
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          if ! git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.VERSION }}" | grep -q .; then
            git tag "v${{ steps.version.outputs.VERSION }}"
            git push origin "v${{ steps.version.outputs.VERSION }}"
          fi

      - name: Decide if release is needed
        id: decide
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          elif ! gh release view "v${{ steps.version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build changelog
        id: changelog
        if: steps.decide.outputs.should_release == 'true'
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: "COMMIT"
          toTag: v${{ steps.version.outputs.VERSION }}
          configurationJson: |
            {
              "template": "Нужен .NET 10 Desktop Runtime. Версия WinForms больше не выпускается: установленная остаётся на своей последней версии, WPF ставится в отдельную папку.\n\n## What's Changed\n#{{UNCATEGORIZED}}",
              "commit_template": "- #{{TITLE}} by @#{{AUTHOR}}",
              "tag_resolver": {
                "method": "sort"
              }
            }
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore MediaOrcestrator.sln

      - name: Build plugins
        run: dotnet build MediaOrcestrator.sln -c Release --no-restore /p:Version=${{ needs.prepare.outputs.version }}

      - name: Publish Runner.Wpf
        run: >
          dotnet publish MediaOrcestrator.Runner.Wpf/MediaOrcestrator.Runner.Wpf.csproj
          -c Release
          -r win-x64
          --self-contained false
          /p:Version=${{ needs.prepare.outputs.version }}
          /p:UpdateRepo=${{ github.repository }}
          -o publish/app

      - name: Publish Updater
        run: >
          dotnet publish MediaOrcestrator.Updater/MediaOrcestrator.Updater.csproj
          -c Release
          -r win-x64
          --self-contained false
          /p:Version=${{ needs.prepare.outputs.version }}
          -o publish/updater

      - name: Copy Updater to app
        shell: bash
        run: |
          cp publish/updater/Updater.exe publish/app/Updater.exe
          cp publish/updater/Updater.dll publish/app/Updater.dll
          cp publish/updater/Updater.runtimeconfig.json publish/app/Updater.runtimeconfig.json
          cp publish/updater/Updater.deps.json publish/app/Updater.deps.json

      - name: Copy ModuleBuilds
        shell: bash
        run: cp -r ModuleBuilds publish/app/ModuleBuilds

      - name: Create zip
        shell: bash
        run: |
          cd publish/app
          7z a -tzip "../../MediaOrcestrator-Wpf-v${{ needs.prepare.outputs.version }}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          files: MediaOrcestrator-Wpf-v${{ needs.prepare.outputs.version }}.zip
          body: ${{ needs.prepare.outputs.changelog }}
